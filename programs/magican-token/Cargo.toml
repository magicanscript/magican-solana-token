[package]
name = "magican-token"
version = "0.1.0"
description = "SPL token program: mint, burn, and transfer with event emission"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "magican_token"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# init-if-needed is enabled here and nowhere else, deliberately. Anchor keeps it
# opt-in because it is easy to misuse; this program needs it only for associated
# token accounts (MintToken.token_account, TransferToken.to_account), where
# Anchor re-validates mint, owner and the canonical ATA address on the
# already-exists branch. It is never applied to a program-owned account, which
# is where reinitialization would actually be dangerous.
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["associated_token"] }


[lints]
workspace = true
