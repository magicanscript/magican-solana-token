# cargo-deny configuration.
# Without this file cargo-deny falls back to an empty license allow-list and
# rejects every dependency, including MIT/Apache-2.0.

[advisories]
yanked = "deny"
ignore = [
    # bincode 1.3.3 — unmaintained. Pulled in transitively by the Solana stack;
    # no direct dependency here. Revisit when Anchor/Solana move off it.
    "RUSTSEC-2025-0141",
    # anyhow 1.0.102 — unsoundness in Error::downcast_mut(). Transitive via the
    # Anchor build path; this program never calls downcast_mut.
    "RUSTSEC-2026-0190",
]

[licenses]
# Permissive licenses only. Anything copyleft should fail the build loudly.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
