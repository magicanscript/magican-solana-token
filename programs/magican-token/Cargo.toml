[package]
name = "magican-token"
version = "0.1.0"
description = "SPL token program: mint, burn, and transfer with event emission"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "magican_token"

[features]
default = ["init-if-needed"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
init-if-needed = ["anchor-lang/init-if-needed"]


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", features = ["associated_token"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
# Anchor's #[program] macro emits `let __type_check_arg: T = panic!();` to check
# instruction argument types at compile time. That code is generated outside the
# annotated module, so a local #[allow] cannot reach it — it has to be set here.
diverging_sub_expression = "allow"
